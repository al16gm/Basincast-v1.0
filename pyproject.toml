[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "basincast-engine"
version = "1.0.0"
description = "Generic monthly forecasting of water resources and reported water demand with transparent reliability"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24,<3", "pandas>=2.0,<3", "scikit-learn>=1.2,<2", "openpyxl>=3.1,<4"]

[project.scripts]
basincast = "basincast.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["basincast*"]
